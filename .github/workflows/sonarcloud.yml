name: SonarCloud analysis

on:
  push:
    branches:
      - react
  pull_request:
    branches:
      - react
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=KulAndy_bazaszachowa
            -Dsonar.organization=kulandy
            -Dsonar.exclusions=src/wasm/**,public/js/**
          projectBaseDir: .
